name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Card thumbnails (scripts/thumbs.mjs) take ~1-2 min to encode from
      # scratch. The cache carries them between deploys; the build re-encodes
      # only images that are new or changed since, by content hash.
      - name: Restore card thumbnails
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/vault-thumbs
          key: thumbs-${{ hashFiles('public/images/*_01.jpg', 'scripts/thumbs.mjs') }}
          restore-keys: thumbs-

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
